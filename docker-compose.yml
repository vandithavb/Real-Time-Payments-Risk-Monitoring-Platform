version: '3.8'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.2
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payments-network

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.2
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - payments-network

  jobmanager:
    build:
      context: .
      dockerfile: ./Dockerfile.flink
    image: pyflink-stripe
    container_name: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./:/opt/flink/usrlib
    command: jobmanager
    environment:
      - RAW_TOPIC=stripe.raw
      - PROCESSED_TOPIC=stripe.processed
      - DLQ_TOPIC=stripe.dlq
      - KAFKA_BOOTSTRAP=redpanda:9092
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - payments-network

  taskmanager:
    image: pyflink-stripe
    container_name: taskmanager
    depends_on:
      redpanda:
        condition: service_healthy
      jobmanager:
        condition: service_started
    volumes:
      - ./:/opt/flink/usrlib
    command: taskmanager
    environment:
      - RAW_TOPIC=stripe.raw
      - PROCESSED_TOPIC=stripe.processed
      - DLQ_TOPIC=stripe.dlq
      - KAFKA_BOOTSTRAP=redpanda:9092
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
    networks:
      - payments-network

networks:
  payments-network:
    driver: bridge
